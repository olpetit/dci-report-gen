report:
  title: "Weekly CI Report"
  author: "DCI Team"
  date: auto
  layout: weekly-report.md.j2

vars:
  date_start: "2025-06-01"

data:
  daily_jobs:
    type: dci
    query: "(((tags in ['daily']) and (components.type='ocp')) and (created_at>='{{date_start}}'))"
    fields: ["id", "name", "status", "created_at", "duration"]
    limit: 20
    sort: "-created_at"
